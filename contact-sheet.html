<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>More Human. — Contact Sheet · 35 slides</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0E0E0E;
    color: #F8F4ED;
    font-family: 'Manrope', system-ui, sans-serif;
    padding: 56px 64px 96px 64px;
  }

  header {
    margin-bottom: 56px;
    padding-bottom: 28px;
    border-bottom: 1px solid rgba(201,169,110,0.4);
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 64px;
  }
  header h1 {
    font-family: 'Times', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 88px;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  header h1 em { color: #C9A96E; }
  header .meta {
    text-align: right;
    color: rgba(248,244,237,0.6);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    line-height: 1.6;
  }
  header .meta b { color: #C9A96E; font-weight: 700; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 28px 24px;
  }

  .cell {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cell a {
    display: block;
    border: 1px solid rgba(201,169,110,0.18);
    background: #060606;
    text-decoration: none;
    transition: all 0.2s ease;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    position: relative;
  }
  .cell a:hover {
    border-color: #C9A96E;
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cell .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(248,244,237,0.55);
  }
  .cell .meta .num { color: #C9A96E; }
  .cell .meta .title { font-style: italic; font-family: 'Times', serif; font-weight: 400; font-size: 13px; letter-spacing: 0; text-transform: none; color: rgba(248,244,237,0.85); }

  /* Section dividers */
  .section-row {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 24px;
    margin-bottom: 4px;
  }
  .section-row:first-of-type { margin-top: 0; }
  .section-row .label {
    font-family: 'Times', serif;
    font-style: italic;
    font-size: 28px;
    color: rgba(248,244,237,0.85);
    white-space: nowrap;
  }
  .section-row .label em { color: #C9A96E; font-style: italic; }
  .section-row .rule {
    flex: 1;
    height: 1px;
    background: rgba(201,169,110,0.35);
  }

  footer {
    margin-top: 80px;
    padding-top: 24px;
    border-top: 1px solid rgba(248,244,237,0.1);
    color: rgba(248,244,237,0.4);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  footer a { color: #C9A96E; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>More <em>Human.</em> — Contact Sheet</h1>
  <div class="meta">
    35 slides · 45 minutes<br>
    Pascal DeGrâce · FitDad 2026<br>
    <b>Click any slide to open</b>
  </div>
</header>

<div class="grid" id="grid"></div>

<footer>
  <span><a href="index.html">→ Run the deck full-screen</a></span>
  <span>Aesthetic: Editorial Cinema Brutalism</span>
  <span>Built April 2026</span>
</footer>

<script>
const SLIDES = [
  ['Title',                   '01-title'],
  ['Opening — cramped',       '02-opening'],
  ['Three honest questions',  '03-provocations'],
  ['Pain calc',               '04-paincalc'],
  ['Old equation',            '05-equation'],
  ['Thesis',                  '06-thesis'],
  ['Tony Robbins quote',      '07-tony-quote'],
  ['"Why can\'t you be like Matt?"', '08-matt'],

  ['2012 — Memories To Go',   '09-memories2go'],
  ['2020 — MyPropertyTour',   '10-mypropertytour'],
  ['2021 — Mistral repreneur','11-mistral-repreneur'],
  ['The loneliness',          '12-loneliness'],
  ['The book + the lunch',    '13-book-gusto'],
  ['Oct 17, 2024',            '14-oct17'],
  ['The hardest day',         '15-fireday'],
  ['Tony Robbins arena',      '16-tony-arena'],
  ['Symplifyai is born',      '17-symplifyai-born'],
  ['Mistral, today',          '18-stack'],
  ['The receipts',            '19-receipts'],
  ['A day · 2024',            '20-tuesday-2024'],
  ['A day · 2026',            '21-tuesday-2026'],
  ['Jacob & Isabelle',        '22-family'],
  ['"It gave me my life back"','23-the-line'],

  ['Hire-hire-hire trap',     '24-hire-trap'],
  ['Dan Martell',             '25-dan-martell'],
  ['Buyback Loop',            '26-buyback-loop'],
  ['Cheapest junior hire',    '27-junior-hire'],

  ['Productivity → Presence', '28-belief'],
  ['Ruthless Mentor',         '29-ruthless-mentor'],
  ['Demo · Discovery → reMarkable', '30-demo'],
  ['Master Prompt',           '31-master-prompt'],
  ['The audit prompt',        '32-audit-prompt'],
  ['Close · "or not."',       '33-close'],
  ['Thank you',               '34-thanks'],
  ['Q & A',                   '35-blackslide']
];

const SECTIONS = [
  { from: 0,  to: 0,  label: 'Title' },
  { from: 1,  to: 7,  label: 'Act I — <em>The Breaking Point</em>' },
  { from: 8,  to: 22, label: 'Act II — <em>The Story</em>' },
  { from: 23, to: 26, label: 'Bridge — <em>The Buyback Loop</em>' },
  { from: 27, to: 34, label: 'Act III — <em>The Handoff</em>' }
];

const grid = document.getElementById('grid');

SECTIONS.forEach(sec => {
  const row = document.createElement('div');
  row.className = 'section-row';
  row.innerHTML = '<span class="label">' + sec.label + '</span><span class="rule"></span>';
  grid.appendChild(row);

  for (let i = sec.from; i <= sec.to; i++) {
    const [title, file] = SLIDES[i];
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `
      <a href="slides/${file}.html" target="_blank">
        <img src="screenshots/${file}.png" alt="${title}">
      </a>
      <div class="meta">
        <span class="num">${String(i + 1).padStart(2, '0')} / 35</span>
        <span class="title">${title}</span>
      </div>`;
    grid.appendChild(cell);
  }
});
</script>
</body>
</html>
