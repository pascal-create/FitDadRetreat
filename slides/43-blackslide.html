<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 35 — Black slide / Q&amp;A</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-bk {
    background: var(--bg-deep);
  }
  .slide-bk::after {
    opacity: 0.06;  /* even lighter grain — almost imperceptible */
  }

  .slide-bk .slide__inner {
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .bk__mark {
    width: 1px;
    height: 80px;
    background: var(--rule-gold);
    margin-bottom: 64px;
  }

  .bk__line {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 350;
    font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1;
    font-size: 56px;
    color: var(--ink-faint);
    letter-spacing: -0.01em;
  }
  .bk__line em {
    color: var(--gold);
    font-style: italic;
  }
</style>
</head>
<body>
<div class="slide slide-bk">
  <div class="slide__inner">
    <div class="bk__mark"></div>
    <p class="bk__line">What's <em>on your mind?</em></p>
  </div>
</div>
</body>
</html>
