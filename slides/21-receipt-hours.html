<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 20 — Receipt 1 · Hours per week</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-rcpt {
    background:
      radial-gradient(ellipse 60% 50% at 50% 30%, rgba(201,169,110,0.10), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0,0,0,0.4), transparent 70%),
      var(--bg);
  }
  .slide-rcpt .slide__inner {
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 32px;
  }

  /* Top: receipt index + label */
  .rcpt__top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--rule-gold);
  }
  .rcpt__top .index {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    gap: 18px;
  }
  .rcpt__top .index::before {
    content: ""; width: 56px; height: 1px; background: var(--rule-gold);
  }
  .rcpt__top .meta {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    color: var(--ink-muted);
  }

  /* Center: the big number */
  .rcpt__center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 40px;
  }
  .rcpt__label {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .rcpt__num {
    font-family: var(--font-display);
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    font-size: 380px;
    line-height: 0.88;
    letter-spacing: -0.045em;
    color: var(--ink-strong);
    display: flex;
    align-items: baseline;
    gap: 40px;
  }
  .rcpt__num .from {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: rgba(201,169,110,0.45);
    text-decoration-thickness: 6px;
  }
  .rcpt__num .arrow {
    font-family: var(--font-body);
    font-weight: 200;
    color: var(--gold);
    font-size: 0.5em;
    line-height: 1;
    transform: translateY(-0.18em);
  }
  .rcpt__num .to {
    color: var(--ink-strong);
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 80, "WONK" 1;
  }
  .rcpt__sub {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 350;
    font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1;
    font-size: 36px;
    line-height: 1.3;
    color: var(--ink-muted);
    max-width: 1500px;
  }
  .rcpt__sub em { color: var(--ink); font-style: italic; }
  .rcpt__sub strong { color: var(--gold); font-weight: 400; font-style: italic; }

  /* Bottom: progress dots showing 1 of 4 */
  .rcpt__bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
  }
  .rcpt__bottom .receipts-label {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-right: 16px;
  }
  .rcpt__bottom .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ink-faint);
    opacity: 0.4;
  }
  .rcpt__bottom .dot.active {
    background: var(--gold);
    opacity: 1;
    box-shadow: 0 0 0 4px rgba(201,169,110,0.18);
  }
</style>
</head>
<body>
<div class="slide slide-rcpt">
  <div class="slide__inner">

    <div class="rcpt__top">
      <span class="index">The receipts · 01 / 04</span>
      <span class="meta">My week — <em>then → now</em></span>
    </div>

    <div class="rcpt__center">
      <span class="rcpt__label">Hours per week at the desk</span>
      <div class="rcpt__num">
        <span class="from">45</span>
        <span class="arrow">→</span>
        <span class="to">19</span>
      </div>
      <p class="rcpt__sub">And I'm getting <em>more done.</em> <strong>Not less. More.</strong></p>
    </div>

    <div class="rcpt__bottom">
      <span class="receipts-label">Receipts</span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </div>

  <div class="slide__chrome">
    <span>21 / 43</span>
  </div>
</div>
</body>
</html>
