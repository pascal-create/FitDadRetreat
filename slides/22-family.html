<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 22 — Jacob and Isabelle</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-fam {
    background:
      radial-gradient(ellipse 70% 60% at 50% 50%, rgba(201,169,110,0.08), transparent 65%),
      radial-gradient(ellipse 100% 60% at 50% 100%, rgba(0,0,0,0.5), transparent 70%),
      var(--bg);
  }
  .slide-fam .slide__inner {
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .fam__photo {
    width: 760px;
    height: 500px;
    margin-bottom: 56px;
    position: relative;
    box-shadow: var(--shadow-elev-3);
    border: 1px solid rgba(201,169,110,0.30);
    overflow: hidden;
  }
  .fam__photo::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("../assets/photos/22-family-biking.jpg");
    background-size: cover;
    background-position: center;
    z-index: 1;
  }
  .fam__photo-tint {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      radial-gradient(ellipse 80% 70% at 30% 30%, rgba(201,169,110,0.30), transparent 65%),
      linear-gradient(180deg, rgba(31,22,12,0.30) 0%, rgba(6,6,6,0.55) 100%);
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  .fam__photo::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    background:
      linear-gradient(180deg, transparent 60%, rgba(6,6,6,0.55) 100%);
  }
  .fam__photo-cap {
    position: absolute;
    bottom: 18px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: end;
    z-index: 4;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(248,244,237,0.75);
  }
  .fam__photo-cap .who { color: var(--gold); }

  .fam__line {
    font-family: var(--font-display);
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    font-size: 96px;
    line-height: 1;
    letter-spacing: -0.025em;
    color: var(--ink-strong);
    margin-bottom: 28px;
  }
  .fam__line em {
    font-style: italic;
    color: var(--gold);
    font-variation-settings: "opsz" 144, "SOFT" 80, "WONK" 1;
  }

  .fam__sub {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 350;
    font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1;
    font-size: 32px;
    color: var(--ink-muted);
  }
</style>
</head>
<body>
<div class="slide slide-fam">
  <div class="slide__inner">

    <div class="fam__photo">
      <div class="fam__photo-tint"></div>
      <div class="fam__photo-cap">
        <span class="who">Jacob, Isabelle &amp; me</span>
        <span>Family ride · 2025</span>
      </div>
    </div>

    <h2 class="fam__line">The most important <em>business</em> I run.</h2>
    <p class="fam__sub">Jacob hasn't asked me <em>"are you almost done?"</em> in eight months.</p>

  </div>

  <div class="slide__chrome">
    <span>Act II — The Story</span>
    <span>22 / 35</span>
  </div>
</div>
</body>
</html>
