<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 08 — Matt</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-quote {
    background:
      radial-gradient(ellipse 70% 60% at 50% 50%, rgba(201,169,110,0.07), transparent 65%),
      var(--bg);
  }

  .slide-quote .slide__inner {
    justify-content: center;
    align-items: center;
    text-align: left;
  }

  .quote {
    position: relative;
    z-index: 3;
    max-width: 1500px;
    margin: 0 auto;
  }

  .quote__mark {
    font-family: var(--font-display);
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
    font-size: 360px;
    line-height: 0.6;
    color: var(--gold);
    opacity: 0.55;
    margin-bottom: -60px;
    margin-left: -16px;
  }

  .quote__line {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 350;
    font-variation-settings: "opsz" 144, "SOFT" 70, "WONK" 1;
    font-size: 168px;
    line-height: 1.0;
    letter-spacing: -0.025em;
    color: var(--ink-strong);
  }

  .quote__line .accent {
    color: var(--gold);
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 90, "WONK" 1;
  }

  .quote__attrib {
    margin-top: 96px;
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .quote__attrib .rule {
    width: 96px;
    background: var(--rule-gold);
  }

  .quote__attrib .who {
    font-family: var(--font-body);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .vignette {
    background:
      radial-gradient(ellipse 90% 80% at 50% 50%, transparent 30%, rgba(0,0,0,0.35) 100%);
  }
</style>
</head>
<body>
<div class="slide slide-quote">
  <div class="vignette"></div>

  <div class="slide__inner">
    <div class="quote">
      <div class="quote__mark">"</div>
      <div class="quote__line">
        Dad, why can't <br>
        you be like <span class="accent">Matt?</span>
      </div>
      <div class="quote__attrib">
        <hr class="rule">
        <span class="who">Jacob — age 7 — at breakfast</span>
      </div>
    </div>
  </div>

  <div class="slide__chrome">
    <span>08 / 46</span>
  </div>
</div>
</body>
</html>
