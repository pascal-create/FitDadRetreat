<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 24 — The hire-hire-hire trap</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-trap {
    background:
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(180,40,40,0.10), transparent 70%),
      radial-gradient(ellipse 50% 50% at 20% 30%, rgba(201,169,110,0.05), transparent 70%),
      var(--bg);
  }
  .slide-trap .slide__inner {
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 32px;
  }

  .trap__head {
    display: flex;
    align-items: center;
    gap: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--rule-gold);
  }
  .trap__head .label {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .trap__head .rule {
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  .trap__head .chapter {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    color: var(--ink-muted);
  }

  .trap__body {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 80px;
    align-items: center;
  }

  .trap__h {
    font-family: var(--font-display);
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    font-size: 92px;
    line-height: 0.96;
    letter-spacing: -0.03em;
    color: var(--ink-strong);
  }
  .trap__h .quote-mark {
    color: var(--gold);
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
    margin-right: 8px;
  }
  .trap__h em {
    font-style: italic;
    color: var(--gold);
    font-variation-settings: "opsz" 144, "SOFT" 80, "WONK" 1;
  }
  .trap__attrib {
    margin-top: 28px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .trap__attrib em {
    font-style: normal;
    color: var(--gold);
  }

  /* The crossing-lines chart */
  .trap__chart {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-width: 720px;
  }
  .trap__chart svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
  .trap__chart .lbl-team {
    fill: var(--gold-bright);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .trap__chart .lbl-time {
    fill: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .trap__chart .axis {
    stroke: var(--rule);
    stroke-width: 1;
  }
  .trap__chart .axis-tick {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.24em;
    fill: var(--ink-faint);
    text-transform: uppercase;
  }
  .trap__chart .crossover {
    fill: #C94545;
    stroke: var(--bg);
    stroke-width: 2;
  }
  .trap__chart .crossover-lbl {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    fill: #E06A6A;
  }

  .trap__close {
    text-align: center;
    padding-top: 24px;
    border-top: 1px solid var(--rule-gold);
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 80, "WONK" 1;
    font-size: 40px;
    color: var(--ink-strong);
    letter-spacing: -0.01em;
  }
  .trap__close em { color: var(--gold); font-style: italic; }
  .trap__close .red { color: #E06A6A; }
</style>
</head>
<body>
<div class="slide slide-trap">
  <div class="slide__inner">

    <div class="trap__head">
      <span class="label">Bridge — the buyback loop</span>
      <span class="rule"></span>
      <span class="chapter">Two years ago — my confession</span>
    </div>

    <div class="trap__body">

      <div>
        <h2 class="trap__h">
          <span class="quote-mark">"</span>To grow,<br>
          I just need to<br>
          <em>hire — hire — hire.</em><span class="quote-mark">"</span>
        </h2>
        <p class="trap__attrib">— me · <em>2023</em></p>
      </div>

      <div class="trap__chart">
        <svg viewBox="0 0 480 360" preserveAspectRatio="xMidYMid meet">
          <!-- Axes -->
          <line class="axis" x1="60"  y1="20"  x2="60"  y2="320"/>
          <line class="axis" x1="60"  y1="320" x2="460" y2="320"/>

          <!-- X axis label -->
          <text class="axis-tick" x="60" y="345">2021</text>
          <text class="axis-tick" x="240" y="345" text-anchor="middle">2022</text>
          <text class="axis-tick" x="455" y="345" text-anchor="end">2023</text>

          <!-- Team headcount: rising curve -->
          <path d="M60 280 Q170 270 240 220 T420 80"
                fill="none"
                stroke="#C9A96E"
                stroke-width="3"
                stroke-linecap="round"/>

          <!-- Filled area under team curve -->
          <path d="M60 280 Q170 270 240 220 T420 80 L420 320 L60 320 Z"
                fill="rgba(201,169,110,0.10)"/>

          <!-- My time / sanity: falling curve -->
          <path d="M60 90 Q170 110 240 220 T420 290"
                fill="none"
                stroke="#F8F4ED"
                stroke-width="3"
                stroke-linecap="round"
                stroke-dasharray="0"/>

          <!-- Crossover marker -->
          <circle class="crossover" cx="240" cy="220" r="7"/>
          <line x1="240" y1="220" x2="270" y2="180" stroke="#E06A6A" stroke-width="1"/>
          <text class="crossover-lbl" x="276" y="178">The break</text>

          <!-- Series labels -->
          <text class="lbl-team" x="430" y="76" text-anchor="end">Team headcount ↗</text>
          <text class="lbl-time" x="74" y="84">My time + sanity ↘</text>
        </svg>
      </div>

    </div>

    <p class="trap__close">I had built a company that was <span class="red">eating me</span> from the inside.</p>

  </div>

  <div class="slide__chrome">
    <span>25 / 36</span>
  </div>
</div>
</body>
</html>
