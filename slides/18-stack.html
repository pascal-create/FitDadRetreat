<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 18 — Stack reveal</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-stack { background: var(--bg); }
  .slide-stack .slide__inner {
    display: grid;
    grid-template-rows: auto 1fr 1fr;
    gap: 36px;
    align-content: start;
  }

  .stack__head {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 64px;
  }
  .stack__head h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    font-size: 88px;
    line-height: 0.92;
    letter-spacing: -0.025em;
    color: var(--ink-strong);
  }
  .stack__head h2 .em {
    font-style: italic;
    color: var(--gold);
    font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1;
  }
  .stack__intro {
    text-align: right;
    max-width: 560px;
    padding-bottom: 18px;
  }
  .stack__intro p {
    font-family: var(--font-body);
    font-size: 20px;
    line-height: 1.55;
    color: var(--ink-muted);
  }
  .stack__intro p strong { color: var(--ink); font-weight: 600; }

  /* Section header */
  .stack__section-h {
    display: flex;
    align-items: center;
    gap: 24px;
    padding-top: 4px;
  }
  .stack__section-h .lbl {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--gold);
    flex: 0 0 auto;
  }
  .stack__section-h .rule {
    flex: 1;
    height: 1px;
    background: var(--rule-gold);
  }
  .stack__section-h .ct {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 18px;
    color: var(--ink-faint);
  }

  /* Logo tiles — real brand marks, sized consistently */
  .logo-row {
    display: grid;
    gap: 16px;
    margin-top: 14px;
  }
  .logo-row--6 { grid-template-columns: repeat(6, 1fr); }
  .logo-row--5 { grid-template-columns: repeat(5, 1fr); }
  .logo-row--4 { grid-template-columns: repeat(4, 1fr); }

  .tool {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 130px;
    padding: 12px 16px;
    background: rgba(248,244,237,0.02);
    border: 1px solid rgba(248,244,237,0.10);
    transition: background 200ms var(--ease-soft);
    position: relative;
    overflow: hidden;
  }
  .tool__img {
    max-height: 72px;
    max-width: 90%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    position: relative;
    z-index: 1;
  }
  /* Logos that ship on a black/dark background — use lighten so the
     black plate disappears into the slide bg, leaving only the mark. */
  .tool__img.knockout {
    mix-blend-mode: lighten;
  }
  /* For dark JPG-on-black logos we sometimes want a *subtle* brand-tinted
     glow underneath to compensate for the lighten merge. */
  .tool--orange::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(229,116,76,0.06), transparent 60%);
    pointer-events: none;
  }
  .tool--teal::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(32,162,167,0.06), transparent 60%);
    pointer-events: none;
  }

  /* Custom agent cards — gold accent */
  .custom-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 14px;
  }
  .custom {
    background:
      linear-gradient(180deg, rgba(201,169,110,0.06), rgba(201,169,110,0.01)),
      var(--bg);
    border: 1px solid rgba(201,169,110,0.32);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: var(--shadow-elev-1);
  }
  .custom__num {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.32em;
    color: var(--gold-bright);
  }
  .custom__name {
    font-family: var(--font-display);
    font-weight: 500;
    font-variation-settings: "opsz" 60, "SOFT" 30;
    font-size: 26px;
    line-height: 1.05;
    color: var(--ink-strong);
    letter-spacing: -0.015em;
  }
  .custom__role {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-muted);
  }

  .stack__pullquote {
    text-align: center;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 350;
    font-size: 22px;
    color: var(--ink-faint);
    padding-top: 4px;
  }
  .stack__pullquote em { color: var(--gold); font-style: italic; }
</style>
</head>
<body>
<div class="slide slide-stack">
  <div class="slide__inner">

    <div class="stack__head">
      <h2>Our AI tools &amp; <span class="em">solutions.</span></h2>
      <div class="stack__intro">
        <p>What we use <strong>every day</strong> — the AI brains we lean on for the thinking, and the workflow agents (Reclaim, Jace, Flow, Fireflies) running the boring in the background.</p>
      </div>
    </div>

    <!-- AI brains -->
    <div>
      <div class="stack__section-h">
        <span class="lbl">The AI brains</span>
        <span class="rule"></span>
        <span class="ct">6 / models</span>
      </div>
      <div class="logo-row logo-row--6">
        <div class="tool">
          <img class="tool__img knockout" src="../assets/logos/chatgpt.png" alt="ChatGPT" style="max-height:56px;">
        </div>
        <div class="tool tool--orange">
          <img class="tool__img knockout" src="../assets/logos/claude.jpg" alt="Claude" style="max-height:90px;">
        </div>
        <div class="tool tool--orange">
          <img class="tool__img knockout" src="../assets/logos/claude-code.jpg" alt="Claude Code" style="max-height:72px;">
        </div>
        <div class="tool">
          <img class="tool__img" src="../assets/logos/gemini.png" alt="Gemini" style="max-height:58px;">
        </div>
        <div class="tool">
          <img class="tool__img knockout" src="../assets/logos/notebooklm.jpg" alt="NotebookLM" style="max-height:54px;">
        </div>
        <div class="tool tool--teal">
          <img class="tool__img knockout" src="../assets/logos/perplexity.png" alt="Perplexity" style="max-height:48px;">
        </div>
      </div>
    </div>

    <!-- Workflow tools -->
    <div>
      <div class="stack__section-h">
        <span class="lbl">The workflow agents</span>
        <span class="rule"></span>
        <span class="ct">4 / off-the-shelf</span>
      </div>
      <div class="logo-row logo-row--4">
        <div class="tool">
          <img class="tool__img" src="../assets/logos/reclaim.png" alt="Reclaim" style="max-height:54px;">
        </div>
        <div class="tool">
          <img class="tool__img knockout" src="../assets/logos/jace.png" alt="Jace" style="max-height:84px;">
        </div>
        <div class="tool">
          <img class="tool__img knockout" src="../assets/logos/wispr-flow.jpg" alt="Wispr Flow" style="max-height:80px;">
        </div>
        <div class="tool">
          <img class="tool__img" src="../assets/logos/fireflies.png" alt="Fireflies.ai" style="max-height:54px;">
        </div>
      </div>
    </div>

  </div>

  <div class="slide__chrome">
    <span>18 / 37</span>
  </div>
</div>
</body>
</html>
