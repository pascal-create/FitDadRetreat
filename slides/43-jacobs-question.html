<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 38 — Remember Jacob's question?</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-jq {
    background: #000;
  }
  /* Disable the global film-grain on this slide for pure black */
  .slide-jq.slide::after { display: none; }

  .slide-jq .slide__inner {
    justify-content: center;
    align-items: center;
    text-align: center;
    display: flex;
    flex-direction: column;
  }

  .jq__line {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 350;
    font-variation-settings: "opsz" 144, "SOFT" 80, "WONK" 1;
    font-size: 144px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: #FFFEFA;
  }
  .jq__line em {
    color: var(--gold);
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
  }
</style>
</head>
<body>
<div class="slide slide-jq">
  <div class="slide__inner">
    <p class="jq__line">Remember <em>Jacob's question?</em></p>
  </div>
</div>
</body>
</html>
