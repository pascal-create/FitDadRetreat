<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 39 — So.</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-so {
    background: #000;
  }
  /* Disable global film-grain on this slide */
  .slide-so.slide::after { display: none; }

  .slide-so .slide__inner {
    justify-content: center;
    align-items: center;
    text-align: center;
    display: flex;
    flex-direction: column;
  }

  .so__word {
    font-family: var(--font-display);
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 20, "WONK" 0;
    font-size: 220px;
    line-height: 1;
    letter-spacing: -0.03em;
    /* Bone White — warm off-white, confident, not bright */
    color: #F8F4ED;
  }
  .so__word .period {
    color: #F8F4ED;
  }
</style>
</head>
<body>
<div class="slide slide-so">
  <div class="slide__inner">
    <p class="so__word">So<span class="period">.</span></p>
  </div>
</div>
</body>
</html>
