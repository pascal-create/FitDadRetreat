<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 23 — The line</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-line {
    background:
      radial-gradient(ellipse 80% 70% at 50% 50%, rgba(201,169,110,0.06), transparent 70%),
      var(--bg);
  }
  .slide-line .slide__inner {
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .line__h {
    font-family: var(--font-display);
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    font-size: 132px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--ink-strong);
    max-width: 1700px;
  }
  .line__h em {
    font-style: italic;
    color: var(--gold);
    font-variation-settings: "opsz" 144, "SOFT" 80, "WONK" 1;
  }
  .line__h .strike {
    text-decoration: line-through;
    text-decoration-color: var(--gold);
    text-decoration-thickness: 4px;
    color: var(--ink-muted);
  }

  .line__rule {
    width: 96px;
    height: 1px;
    background: var(--rule-gold);
    margin: 56px 0;
  }

  .line__sub {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 350;
    font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1;
    font-size: 32px;
    color: var(--ink-muted);
    max-width: 900px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="slide slide-line">
  <div class="slide__inner">

    <h2 class="line__h">
      AI didn't bring me <span class="strike">success</span>.<br>
      It gave me my <em>life back.</em>
    </h2>

    <hr class="line__rule" style="border:0;">

  </div>

  <div class="slide__chrome">
    <span>31 / 46</span>
  </div>
</div>
</body>
</html>
