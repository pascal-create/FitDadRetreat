<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 25 — Dan Martell</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-dm {
    background:
      radial-gradient(ellipse 60% 60% at 30% 50%, rgba(201,169,110,0.08), transparent 70%),
      var(--bg);
  }
  .slide-dm .slide__inner {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 96px;
    align-items: center;
  }

  .dm__quote {
    position: relative;
  }

  .dm__mark {
    font-family: var(--font-display);
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
    font-size: 220px;
    line-height: 0.5;
    color: var(--gold);
    opacity: 0.55;
    margin-bottom: -16px;
  }

  .dm__line {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1;
    font-size: 88px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--ink-strong);
  }
  .dm__line strong {
    color: var(--gold);
    font-weight: 400;
    font-style: italic;
  }

  .dm__attrib {
    margin-top: 56px;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .dm__attrib .rule { width: 96px; height: 1px; background: var(--rule-gold); }
  .dm__attrib .who {
    font-family: var(--font-body);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .dm__attrib .who em {
    color: var(--gold);
    font-style: normal;
  }

  /* Real book mockup */
  .dm__book {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .dm__book-img {
    width: 580px;
    max-width: 100%;
    height: auto;
    filter: drop-shadow(0 24px 48px rgba(0,0,0,0.55))
            drop-shadow(0 4px 12px rgba(0,0,0,0.45));
    transform: rotate(-2deg);
  }
  .dm__book-cap {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
  }
  .dm__book-cap em {
    color: var(--ink-strong);
    font-style: normal;
  }
</style>
</head>
<body>
<div class="slide slide-dm">
  <div class="slide__inner">

    <div class="dm__quote">
      <div class="dm__mark">"</div>
      <p class="dm__line">
        Don't hire to grow your business.<br>
        Hire to <strong>buy back your time.</strong>
      </p>
      <div class="dm__attrib">
        <span class="rule"></span>
        <span class="who">Dan Martell · <em>my mentor</em> · author</span>
      </div>
    </div>

    <div class="dm__book">
      <img class="dm__book-img" src="../assets/BBYT-Book-Mockups-003-1024x819.png" alt="Buy Back Your Time — Dan Martell">
      <span class="dm__book-cap">If you haven't read it — <em>read it.</em></span>
    </div>

  </div>

  <div class="slide__chrome">
    <span>25 / 35</span>
  </div>
</div>
</body>
</html>
