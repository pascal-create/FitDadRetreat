<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 39 — The close</title>
<link rel="stylesheet" href="../styles/design-system.css">
<style>
  .slide-close {
    background: #060606;
    overflow: hidden;
  }

  .close__photo {
    position: absolute;
    inset: 0;
    background-image: url("../assets/photos/33-fatherson.jpg");
    background-size: cover;
    background-position: center 60%;
    z-index: 1;
  }
  .close__photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(6,6,6,0.80) 0%,
        rgba(6,6,6,0.45) 35%,
        rgba(6,6,6,0.30) 60%,
        rgba(6,6,6,0.80) 100%),
      linear-gradient(90deg,
        rgba(6,6,6,0.55) 0%,
        rgba(6,6,6,0.15) 50%,
        rgba(6,6,6,0.55) 100%);
  }

  .slide-close .slide__inner {
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 3;
    position: relative;
  }

  .close__h {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 350;
    font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1;
    font-size: 124px;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: #FFFEFA;
    text-shadow: 0 4px 32px rgba(0,0,0,0.65);
    max-width: 1700px;
  }
  .close__h .yes {
    font-style: italic;
    color: var(--gold);
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
  }
</style>
</head>
<body>
<div class="slide slide-close">
  <div class="close__photo"></div>
  <div class="photo-tint photo-tint--warm"></div>

  <div class="slide__inner">
    <h2 class="close__h">
      Two years from now,<br>
      your kid is going to remember<br>
      whether you were there <span class="yes">or not.</span>
    </h2>
  </div>
</div>
</body>
</html>
